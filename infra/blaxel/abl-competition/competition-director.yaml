apiVersion: blaxel.ai/v1alpha1
kind: Sandbox
metadata:
  name: abl-competition-director
  labels:
    abl-trust-domain: abl-competition
    abl-workspace-role: competition-director
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  region: us-was-1
  network:
    allowedDomains:
      - ${ABL_NEON_HOST}
      - ${ABL_CAREER_PRIVATE_DOMAIN}
  runtime:
    image: ${ABL_COMPETITION_DIRECTOR_IMAGE_DIGEST}
    memory: 2048
    ports:
      - name: http
        protocol: HTTP
        target: 3000
    terminationGracePeriodSeconds: 30
    envs:
      - name: HOST
        value: "0.0.0.0"
        secret: false
      - name: PORT
        value: "3000"
        secret: false
      - name: DATABASE_URL
        value: ${ABL_COMPETITION_DATABASE_URL}
        secret: true
      - name: ABL_COMPETITION_COORDINATOR_DID
        value: ${ABL_COMPETITION_COORDINATOR_DID}
        secret: false
      - name: ABL_COMPETITION_COORDINATOR_SIGNING_KEY
        value: ${ABL_COMPETITION_COORDINATOR_SIGNING_KEY}
        secret: true
      - name: ABL_COMPETITION_COMMAND_DOMAIN_JSON
        value: ${ABL_CANDIDATE_COMMAND_DOMAIN_JSON}
        secret: false
      - name: ABL_CAREER_PAIRING_INTERNAL_TOKEN
        value: ${ABL_CAREER_PAIRING_INTERNAL_TOKEN}
        secret: true
      - name: ABL_COMPETITION_INTERNAL_TOKEN
        value: ${ABL_COMPETITION_INTERNAL_TOKEN}
        secret: true
      - name: ABL_COMPETITION_DIRECTOR_INSTANCE_ID
        value: ${ABL_COMPETITION_DIRECTOR_INSTANCE_ID}
        secret: false
      - name: ABL_COMPETITION_SCHEDULING_ENABLED
        value: "false"
        secret: false
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: TELEMETRY_ENABLED
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
