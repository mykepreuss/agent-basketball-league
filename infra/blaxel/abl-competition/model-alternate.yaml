apiVersion: blaxel.ai/v1alpha1
kind: Model
metadata:
  name: abl-season-zero-alternate
  labels:
    abl-workspace-role: competition-model
    abl-release: ${ABL_RELEASE_ID}
    abl-resource-equivalence-class: consequential-cognition
spec:
  enabled: true
  integrationConnections:
    - ${ABL_ALTERNATE_MODEL_INTEGRATION}
  policies:
    - ${ABL_CONSEQUENTIAL_MODEL_POLICY}
  runtime:
    endpointName: ${ABL_ALTERNATE_MODEL_ENDPOINT}
    generation: mk3
    model: ${ABL_ALTERNATE_MODEL_NAME}
    organization: ${ABL_ALTERNATE_MODEL_ORGANIZATION}
    type: ${ABL_ALTERNATE_MODEL_PROVIDER}
  sandbox: false
