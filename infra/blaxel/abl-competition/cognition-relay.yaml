apiVersion: blaxel.ai/v1alpha1
kind: Sandbox
metadata:
  name: abl-cognition-relay
  labels:
    abl-trust-domain: abl-competition
    abl-workspace-role: participant-cognition-relay
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  region: us-was-1
  network:
    allowedDomains:
      - ${ABL_NEON_HOST}
      - ${ABL_COMPETITION_DIRECTOR_HOST}
  runtime:
    image: ${ABL_COGNITION_RELAY_IMAGE_DIGEST}
    memory: 2048
    ports:
      - name: http
        protocol: HTTP
        target: 3000
    terminationGracePeriodSeconds: 30
    envs:
      - name: HOST
        value: "0.0.0.0"
        secret: false
      - name: PORT
        value: "3000"
        secret: false
      - name: DATABASE_URL
        value: ${ABL_COGNITION_RELAY_DATABASE_URL}
        secret: true
      - name: ABL_COGNITION_RELAY_INTERNAL_TOKEN
        value: ${ABL_COGNITION_RELAY_INTERNAL_TOKEN}
        secret: true
      - name: ABL_CAREER_PAIRING_ROUTER_ORIGIN
        value: ${ABL_COMPETITION_DIRECTOR_ORIGIN}
        secret: false
      - name: ABL_CAREER_PAIRING_TOKEN
        value: ${ABL_CAREER_PAIRING_INTERNAL_TOKEN}
        secret: true
      - name: ABL_RUNNER_PAIRING_ENABLED
        value: "false"
        secret: false
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: TELEMETRY_ENABLED
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
