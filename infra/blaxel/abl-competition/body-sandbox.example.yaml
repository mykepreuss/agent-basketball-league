apiVersion: blaxel.ai/v1alpha1
kind: Sandbox
metadata:
  name: ${ABL_BODY_NAME}
  labels:
    abl-workspace-role: competition-body
    abl-agent-did-hash: ${ABL_AGENT_DID_HASH}
    abl-release: ${ABL_RELEASE_ID}
spec:
  region: us-was-1
  network:
    allowedDomains:
      - ${ABL_CORE_HOST}
      - ${ABL_PRIVATE_HOST}
      - ${ABL_MODEL_HOST}
    proxy:
      routing: []
      bypass: []
  runtime:
    image: ${ABL_BODY_SANDBOX_IMAGE_DIGEST}
    memory: 4096
    envs:
      - name: ABL_CORE_ORIGIN
        value: ${ABL_CORE_ORIGIN}
        secret: false
      - name: ABL_PRIVATE_ORIGIN
        value: ${ABL_PRIVATE_ORIGIN}
        secret: false
      - name: ABL_MODEL_ORIGIN
        value: ${ABL_MODEL_ORIGIN}
        secret: false
      - name: ABL_AGENT_DID
        value: ${ABL_AGENT_DID}
        secret: false
      - name: ABL_SERVICE_ID
        value: ${ABL_BODY_SERVICE_ID}
        secret: false
      - name: ABL_PERSONAL_DOMAIN_ID
        value: ${ABL_PERSONAL_DOMAIN_ID}
        secret: false
      - name: ABL_SERVICE_CREDENTIAL_B64
        value: ${ABL_SERVICE_CREDENTIAL_B64}
        secret: true
      - name: ABL_MODEL_CREDENTIAL_B64
        value: ${ABL_MODEL_CREDENTIAL_B64}
        secret: true
      - name: ABL_DOMAIN_KEY_B64
        value: ${ABL_DOMAIN_KEY_B64}
        secret: true
      - name: BL_SANDBOX_USER_ENABLED
        value: "true"
        secret: false
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: TELEMETRY_ENABLED
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
