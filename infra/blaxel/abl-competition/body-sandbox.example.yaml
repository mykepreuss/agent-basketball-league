apiVersion: blaxel.ai/v1alpha1
kind: Sandbox
metadata:
  name: ${ABL_BODY_NAME}
  labels:
    abl-workspace-role: competition-body
    abl-agent-did-hash: ${ABL_AGENT_DID_HASH}
    abl-release: ${ABL_RELEASE_ID}
spec:
  region: us-was-1
  network:
    allowedDomains:
      - ${ABL_FIXED_BROKER_HOST}
  runtime:
    image: ${ABL_BODY_SANDBOX_IMAGE_DIGEST}
    memory: 4096
    envs:
      - name: ABL_RUNTIME_RESOURCE_TYPE
        value: SANDBOX
        secret: false
      - name: ABL_RUNTIME_RESOURCE_NAME
        value: ${ABL_BODY_NAME}
        secret: false
      - name: ABL_RUNTIME_IMAGE_REFERENCE
        value: ${ABL_BODY_SANDBOX_IMAGE_DIGEST}
        secret: false
      - name: ABL_APPLICATION_ID
        value: ${ABL_CANDIDATE_TARGET_APPLICATION_ID}
        secret: false
      - name: ABL_ROLE_CLASS
        value: ${ABL_ROLE_CLASS}
        secret: false
      - name: ABL_COGNITION_MODE
        value: PARTICIPANT_CONTROLLED
        secret: false
      - name: ABL_COGNITION_RELAY_PUBLIC_ORIGIN
        value: ${ABL_COGNITION_RELAY_PUBLIC_ORIGIN}
        secret: false
      - name: ABL_RUNNER_BUNDLE_DIGEST
        value: ${ABL_RUNNER_BUNDLE_DIGEST}
        secret: false
      - name: ABL_COMPETITION_COORDINATOR_DID
        value: ${ABL_COMPETITION_COORDINATOR_DID}
        secret: false
      - name: ABL_COMPETITION_COORDINATOR_SIGNER_ADDRESS
        value: ${ABL_COMPETITION_COORDINATOR_SIGNER_ADDRESS}
        secret: false
      - name: ABL_CANDIDATE_COMMAND_DOMAIN_JSON
        value: ${ABL_CANDIDATE_COMMAND_DOMAIN_JSON}
        secret: false
      - name: ABL_CAREER_PAIRING_INTERNAL_TOKEN
        value: ${ABL_CAREER_PAIRING_INTERNAL_TOKEN}
        secret: true
      - name: ABL_FIXED_BROKER_ORIGIN
        value: ${ABL_FIXED_BROKER_ORIGIN}
        secret: false
      - name: ABL_AGENT_DID
        value: ${ABL_AGENT_DID}
        secret: false
      - name: ABL_AGENT_SIGNER_ADDRESS
        value: ${ABL_AGENT_SIGNER_ADDRESS}
        secret: false
      - name: ABL_FIXED_BROKER_CAPABILITY_TOKEN_B64
        value: ${ABL_FIXED_BROKER_CAPABILITY_TOKEN_B64}
        secret: true
      - name: ABL_FIXED_BROKER_PREVIEW_TOKEN
        value: ${ABL_FIXED_BROKER_PREVIEW_TOKEN}
        secret: true
      - name: BL_SANDBOX_USER_ENABLED
        value: "true"
        secret: false
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: TELEMETRY_ENABLED
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
