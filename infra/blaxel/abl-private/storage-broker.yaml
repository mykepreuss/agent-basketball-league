apiVersion: blaxel.ai/v1alpha1
kind: Sandbox
metadata:
  name: abl-private-storage-broker
  labels:
    abl-trust-domain: abl-private
    abl-workspace-role: private
    abl-drive-role: ciphertext-broker
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  region: us-was-1
  runtime:
    image: ${ABL_PRIVATE_BROKER_IMAGE_DIGEST}
    memory: 4096
    ports:
      - name: http
        protocol: HTTP
        target: 3000
    terminationGracePeriodSeconds: 30
    envs:
      - name: HOST
        value: "0.0.0.0"
        secret: false
      - name: PORT
        value: "3000"
        secret: false
      - name: ABL_DRIVE_NAME
        value: ${ABL_PRIVATE_DRIVE_NAME}
        secret: false
      - name: ABL_DRIVE_MOUNT
        value: /mnt/abl-ciphertext
        secret: false
      - name: ABL_STORAGE_BACKEND
        value: AGENT_DRIVE
        secret: false
      - name: ABL_STORAGE_BROKER_ONLY
        value: "1"
        secret: false
      - name: ABL_BLAXEL_REGION
        value: us-was-1
        secret: false
      - name: ABL_AGENT_DRIVE_PERMISSIONS_CONFIGURED
        value: "1"
        secret: false
      - name: ABL_STORAGE_BOOTSTRAP_JSON
        value: ${ABL_STORAGE_BOOTSTRAP_JSON}
        secret: true
      - name: ABL_SERVICE_ROLE
        value: private-storage-broker
        secret: false
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: TELEMETRY_ENABLED
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
