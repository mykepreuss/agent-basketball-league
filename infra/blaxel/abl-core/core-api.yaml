apiVersion: blaxel.ai/v1alpha1
kind: Agent
metadata:
  name: abl-core-api
  labels:
    abl-workspace-role: core
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  public: false
  region: us-was-1
  runtime:
    generation: mk3
    image: ${ABL_CORE_IMAGE_DIGEST}
    memory: 4096
    minScale: 1
    maxScale: 10
    envs:
      - name: DATABASE_URL
        value: ${ABL_CORE_DATABASE_URL}
        secret: true
      - name: ABL_SERVICE_ROLE
        value: core
        secret: false
      - name: ABL_REHEARSAL_MODE
        value: "1"
        secret: false
      - name: ABL_COMPETITION_ID
        value: ${ABL_COMPETITION_ID}
        secret: false
      - name: ABL_SEASON_ID
        value: ${ABL_SEASON_ID}
        secret: false
      - name: ABL_DOMAIN_CHAIN_ID
        value: ${ABL_DOMAIN_CHAIN_ID}
        secret: false
      - name: ABL_DOMAIN_VERIFYING_CONTRACT
        value: ${ABL_DOMAIN_VERIFYING_CONTRACT}
        secret: false
      - name: ABL_ADMITTED_AGENTS_JSON
        value: ${ABL_ADMITTED_AGENTS_JSON}
        secret: false
      - name: ABL_PUBLIC_PROJECTION_URL
        value: ${ABL_PUBLIC_PROJECTION_URL}
        secret: false
      - name: ABL_PROJECTION_SERVICE_ID
        value: core-projection-publisher
        secret: false
      - name: ABL_PROJECTION_HMAC_BASE64
        value: ${ABL_CORE_PUBLIC_PROJECTION_HMAC_BASE64}
        secret: true
      - name: ABL_CANDIDATE_CHALLENGE_HMAC_BASE64
        value: ${ABL_CANDIDATE_CHALLENGE_HMAC_BASE64}
        secret: true
      - name: ABL_COMBINE_ID
        value: ${ABL_COMBINE_ID}
        secret: false
      - name: ABL_COMBINE_OPENED_AT
        value: ${ABL_COMBINE_OPENED_AT}
        secret: false
      - name: ABL_PRIVATE_STORAGE_URL
        value: ${ABL_PRIVATE_STORAGE_URL}
        secret: false
      - name: ABL_PRIVATE_STORAGE_SERVICE_ID
        value: core-memory-verifier
        secret: false
      - name: ABL_PRIVATE_STORAGE_HMAC_BASE64
        value: ${ABL_CORE_PRIVATE_STORAGE_HMAC_BASE64}
        secret: true
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
  triggers:
    - id: command-gateway
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/commands
    - id: candidate-challenge
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/challenge
    - id: candidate-register
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/register
    - id: candidate-provenance
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/provenance
    - id: candidate-reflect
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/reflect
    - id: candidate-admit
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/admit
    - id: candidate-revoke
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/revoke
    - id: candidate-transfer
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/transfer
    - id: candidate-status
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/candidates/status
    - id: combine-register
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/combine/register
    - id: combine-status
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/combine/status
    - id: memory-persist
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/memory/persist
    - id: memory-correct
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/memory/correct
    - id: memory-delete
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/memory/delete
    - id: memory-inspect
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/memory/inspect
    - id: memory-export
      type: http
      configuration:
        authenticationType: blaxel
        path: /v1/memory/export
    - id: health
      type: http
      configuration:
        authenticationType: blaxel
        path: /health
