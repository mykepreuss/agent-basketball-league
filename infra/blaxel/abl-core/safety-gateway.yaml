apiVersion: blaxel.ai/v1alpha1
kind: Sandbox
metadata:
  name: abl-safety-gateway
  labels:
    abl-trust-domain: abl-core
    abl-workspace-role: fixed-safety-boundary
    abl-drive-role: safety-ledger-writer
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  region: us-was-1
  runtime:
    image: ${ABL_SAFETY_GATEWAY_IMAGE_DIGEST}
    memory: 1024
    ports:
      - name: http
        protocol: HTTP
        target: 3000
    terminationGracePeriodSeconds: 30
    envs:
      - name: HOST
        value: "0.0.0.0"
        secret: false
      - name: PORT
        value: "3000"
        secret: false
      - name: ABL_SAFETY_LEDGER_ROOT
        value: /mnt/abl-safety
        secret: false
      - name: ABL_SAFETY_STORAGE_BACKEND
        value: AGENT_DRIVE
        secret: false
      - name: ABL_BLAXEL_REGION
        value: us-was-1
        secret: false
      - name: ABL_SAFETY_CUSTODIAN_PUBLIC_KEYS_JSON
        value: ${ABL_SAFETY_CUSTODIAN_PUBLIC_KEYS_JSON}
        secret: false
      - name: ABL_SAFETY_DOMAIN_CHAIN_ID
        value: ${ABL_SAFETY_DOMAIN_CHAIN_ID}
        secret: false
      - name: ABL_SAFETY_DOMAIN_VERIFYING_CONTRACT
        value: ${ABL_SAFETY_DOMAIN_VERIFYING_CONTRACT}
        secret: false
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: TELEMETRY_ENABLED
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
