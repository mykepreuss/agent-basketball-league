apiVersion: blaxel.ai/v1alpha1
kind: Function
metadata:
  name: abl-government-mcp
  labels:
    abl-trust-domain: abl-core
    abl-workspace-role: core
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  public: false
  region: us-was-1
  runtime:
    generation: mk3
    image: ${ABL_GOVERNMENT_MCP_IMAGE_DIGEST}
    memory: 2048
    minScale: 0
    maxScale: 1
    transport: http-stream
    ports:
      - name: http
        protocol: HTTP
        target: 8080
    envs:
      - name: ABL_CORE_BASE_URL
        value: ${ABL_CORE_BASE_URL}
        secret: false
      - name: ABL_CORE_SERVICE_CREDENTIAL
        value: ${ABL_GOVERNMENT_CORE_CREDENTIAL}
        secret: true
      - name: ABL_CORE_PREVIEW_TOKEN
        value: ${ABL_CORE_PREVIEW_TOKEN}
        secret: true
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
