apiVersion: blaxel.ai/v1alpha1
kind: Sandbox
metadata:
  name: abl-stage-fixed-broker
  labels:
    abl-stage: private-gate-2
    abl-authority: fixed-body-broker
spec:
  region: us-was-1
  lifecycle:
    expirationPolicies:
      - action: delete
        type: ttl-idle
        value: 4h
    terminatedRetention: 24h
  network:
    allowedDomains:
      - ${ABL_STAGE_CORE_HOST}
      - ${ABL_STAGE_PRIVATE_STORAGE_HOST}
    proxy:
      routing: []
      bypass: []
  runtime:
    image: ${ABL_STAGE_FIXED_BROKER_IMAGE_DIGEST}
    memory: 1024
    ports:
      - name: http
        protocol: HTTP
        target: 3000
    terminationGracePeriodSeconds: 30
    envs:
      - name: HOST
        value: "0.0.0.0"
        secret: false
      - name: PORT
        value: "3000"
        secret: false
      - name: ABL_CORE_ORIGIN
        value: ${ABL_STAGE_PRIVATE_CORE_ORIGIN}
        secret: false
      - name: ABL_CORE_AUTH_MODE
        value: BLAXEL_PRIVATE_PREVIEW
        secret: false
      - name: ABL_PRIVATE_ORIGIN
        value: ${ABL_STAGE_PRIVATE_STORAGE_ORIGIN}
        secret: false
      - name: ABL_PRIVATE_AUTH_MODE
        value: BLAXEL_PRIVATE_PREVIEW
        secret: false
      - name: ABL_AGENT_DID
        value: ${ABL_STAGE_AGENT_DID}
        secret: false
      - name: ABL_AGENT_SIGNER_ADDRESS
        value: ${ABL_STAGE_AGENT_SIGNER_ADDRESS}
        secret: false
      - name: ABL_SERVICE_ID
        value: stage-fixed-broker-001
        secret: false
      - name: ABL_PERSONAL_DOMAIN_ID
        value: ${ABL_STAGE_PERSONAL_DOMAIN_ID}
        secret: false
      - name: ABL_BODY_CAPABILITY_EXPIRES_AT
        value: ${ABL_STAGE_FIXED_BROKER_CAPABILITY_EXPIRES_AT}
        secret: false
      - name: ABL_BODY_CAPABILITY_TOKEN_B64
        value: ${ABL_STAGE_FIXED_BROKER_CAPABILITY_TOKEN_B64}
        secret: true
      - name: ABL_SERVICE_CREDENTIAL_B64
        value: ${ABL_STAGE_BODY_SERVICE_CREDENTIAL_B64}
        secret: true
      - name: ABL_DOMAIN_KEY_B64
        value: ${ABL_STAGE_DOMAIN_KEY_B64}
        secret: true
      - name: ABL_AGENT_SIGNING_KEY_B64
        value: ${ABL_STAGE_AGENT_SIGNING_KEY_B64}
        secret: true
      - name: ABL_CORE_PREVIEW_TOKEN_B64
        value: ${ABL_STAGE_PRIVATE_CORE_PREVIEW_TOKEN_B64}
        secret: true
      - name: ABL_PRIVATE_PREVIEW_TOKEN_B64
        value: ${ABL_STAGE_PRIVATE_STORAGE_PREVIEW_TOKEN_B64}
        secret: true
      - name: ABL_DOMAIN_CHAIN_ID
        value: ${ABL_STAGE_DOMAIN_CHAIN_ID}
        secret: false
      - name: ABL_DOMAIN_VERIFYING_CONTRACT
        value: ${ABL_STAGE_DOMAIN_VERIFYING_CONTRACT}
        secret: false
      - name: DO_NOT_TRACK
        value: "1"
        secret: false
      - name: BL_ENABLE_OPENTELEMETRY
        value: "false"
        secret: false
      - name: ABL_LOG_CONTENT
        value: "false"
        secret: false
