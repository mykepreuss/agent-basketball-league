        secret: true
      - name: ABL_PRIVATE_STORAGE_SERVICE_ID
        value: stage-core-memory-verifier
        secret: false
      - name: ABL_PRIVATE_STORAGE_HMAC_BASE64
        value: ${ABL_STAGE_PRIVATE_STORAGE_HMAC_BASE64}
        secret: true
      - name: ABL_RECOGNIZED_BODY_IMAGE_DIGESTS_JSON
        value: ${ABL_STAGE_RECOGNIZED_BODY_IMAGE_DIGESTS_JSON}
