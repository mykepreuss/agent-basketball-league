apiVersion: blaxel.ai/v1alpha1
kind: Application
metadata:
  name: abl-spectator-arena
  labels:
    abl-workspace-role: public
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  image: ${ABL_ARENA_APP_IMAGE_DIGEST}
  memory: 4096
  port: 3000
  region: us-was-1
  envs:
    - name: ABL_PUBLIC_API_URL
      value: ${ABL_PUBLIC_API_URL}
      secret: false
    - name: DO_NOT_TRACK
      value: "1"
      secret: false
    - name: BL_ENABLE_OPENTELEMETRY
      value: "false"
      secret: false
