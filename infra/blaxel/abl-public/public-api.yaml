apiVersion: blaxel.ai/v1alpha1
kind: Application
metadata:
  name: abl-public-api
  labels:
    abl-workspace-role: public
    abl-release: ${ABL_RELEASE_ID}
spec:
  enabled: true
  image: ${ABL_PUBLIC_API_IMAGE_DIGEST}
  memory: 4096
  port: 8080
  region: us-was-1
  envs:
    - name: ABL_PROJECTION_INPUT_URL
      value: ${ABL_PROJECTION_INPUT_URL}
      secret: false
    - name: ABL_PROJECTION_VERIFY_KEY_REGISTRY
      value: ${ABL_PROJECTION_VERIFY_KEY_REGISTRY}
      secret: false
    - name: DO_NOT_TRACK
      value: "1"
      secret: false
    - name: BL_ENABLE_OPENTELEMETRY
      value: "false"
      secret: false
